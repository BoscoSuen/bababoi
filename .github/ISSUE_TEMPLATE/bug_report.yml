name: Bug report / 错误报告
description: Report broken behavior with reproducible details. / 报告可复现的错误行为。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Claude Trading Skills.

        Claude Trading Skills is educational and process-focused. Please report
        reproducible product behavior, not requests for personalized trading advice.

        感谢您的帮助。请报告可复现的行为问题，不要提交个人投资建议请求。
  - type: textarea
    id: summary
    attributes:
      label: What is broken? / 什么出了问题？
      description: Summarize the bug in one or two sentences. / 用1-2句话概括错误。
      placeholder: "The vcp-screener command fails when..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the commands, files, inputs, or workflow steps. / 请提供命令、文件、输入或工作流步骤。
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior / 期望行为
      description: Explain what should happen instead. / 说明预期的正确行为。
      placeholder: "The command should..."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior / 实际行为
      description: Paste the relevant sanitized error or output. / 请粘贴已脱敏的错误或输出。
      render: shell
    validations:
      required: true
  - type: input
    id: affected-area
    attributes:
      label: Affected skill, workflow, or file / 受影响的技能、工作流或文件
      description: Name the affected repository path if known. / 如果知道，请填写受影响的仓库路径。
      placeholder: "skills/vcp-screener or workflows/swing-opportunity-daily.yaml"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Include the OS, Python version, runner, and dependency manager. / 请填写OS、Python版本、运行方式和依赖管理工具。
      placeholder: "macOS 15, Python 3.9, uv, Claude Code"
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context / 补充信息
      description: Add sanitized sample data, screenshots, or links if useful. / 如需要可添加已脱敏的数据、截图或链接。
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements / 确认事项
      description: Confirm both items before submitting. / 提交前请确认以下两项。
      options:
        - label: I removed secrets, API keys, personal information, and brokerage account data. / 已移除密钥、API密钥、个人信息和证券账户数据。
          required: true
        - label: This is not a request for financial advice, buy/sell recommendations, profit guarantees, or broker execution. / 本报告不涉及金融建议、买卖推荐、收益保证或经纪商执行请求。
          required: true
