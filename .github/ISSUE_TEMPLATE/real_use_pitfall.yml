name: Real-use pitfall / 实际使用问题
description: Share practical friction found during real use. / 分享实际使用中发现的问题。
title: "[Pitfall]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for setup friction, unclear warnings, missing runbook steps,
        unsafe defaults, or unclear educational boundaries found during real use.

        用于反馈设置障碍、不明确的警告、缺失的runbook步骤、危险的默认值或教育目的边界问题。
  - type: textarea
    id: pitfall
    attributes:
      label: Pitfall / 遇到的问题
      description: Explain what went wrong or became confusing in real use. / 说明实际使用中什么出错了或令人困惑。
      placeholder: "I expected the workflow to stop when..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / 使用场景
      description: Name the workflow, skill, data source, or documentation path. / 请填写使用的workflow、skill、数据源或文档路径。
      placeholder: "docs/en/find-your-workflow.md with..."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / 影响
      description: Explain the effect on setup, review quality, risk management, or learning. / 说明对设置、审查质量、风险管理或学习的影响。
      placeholder: "This caused me to..."
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix / 改进建议
      description: Suggest clearer wording, a test, a guardrail, or a runbook step. / 建议更清晰的措辞、测试、防护措施或runbook步骤。
      placeholder: "Add a warning before..."
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context / 补充信息
      description: Add sanitized examples, screenshots, or links if useful. / 如需要可添加已脱敏的示例、截图或链接。
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements / 确认事项
      description: Confirm both items before submitting. / 提交前请确认以下两项。
      options:
        - label: I removed secrets, API keys, personal information, and brokerage account data. / 已移除密钥、API密钥、个人信息和证券账户数据。
          required: true
        - label: This is not a request for financial advice, buy/sell recommendations, profit guarantees, or broker execution. / 本报告不涉及金融建议、买卖推荐、收益保证或经纪商执行请求。
          required: true
