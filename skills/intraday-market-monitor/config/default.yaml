# intraday-market-monitor defaults. Every threshold here is a tunable starting
# point, not a validated edge. Override with --config <file>.
schema_version: 1

provider:
  name: polygon            # polygon | fixture
  delay_minutes: 15        # Polygon Stocks Starter is 15-minute delayed

# ET run slots. HH:20 → the clock-hour bar closing at HH:00 is confirmed
# (data through HH:05). 09:50 = opening read, 15:50 = pre-close read,
# 16:20 = full-session wrap-up.
slots: ["0950", "1020", "1120", "1220", "1320", "1420", "1520", "1550", "1620"]
narrative_slots: ["1020", "1520"]   # plus any slot where the posture flips

universe:
  # Snapshot rows kept for breadth statistics.
  symbol_regex: "^[A-Z]{1,5}$"
  min_prev_close: 5.0
  min_prev_volume: 100000
  avg_volume_sessions: 20

sectors:
  benchmark: SPY
  core: [SPY, QQQ, IWM]
  spdr: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
  risk_gauges: [TLT, HYG, GLD]
  risk_on: [XLK, XLY, XLC, IWM, HYG]
  risk_off: [XLP, XLU, XLV, TLT, GLD]

# Cumulative share of a normal session's volume traded by minute-since-open.
# Piecewise-linear; the U-shape front-loads the open and the close.
volume_curve:
  - [0, 0.00]
  - [30, 0.15]
  - [60, 0.24]
  - [120, 0.36]
  - [180, 0.46]
  - [240, 0.56]
  - [300, 0.66]
  - [360, 0.80]
  - [390, 1.00]

watchlist:
  file: state/watchlist.yaml
  vcp_min_rating: B            # include vcp_screener_*.json rows rated A/B
  rel_vol_breakout_min: 1.2
  gap_min_pct: 2.0

posture:
  weights: {breadth: 0.4, index: 0.3, sector: 0.3}
  allow_min_score: 60
  cash_max_score: 40
  cash_breadth_pct_advancers_max: 30
  cash_ud_ratio_max: 0.5
  hysteresis_slots: 2          # flips need two consecutive slots ...
  hysteresis_override_delta: 15  # ... unless |Δscore| >= this
  daily_baseline_glob: "reports/exposure_posture_*.json"
  daily_cap_steps: 1           # never more than one step above the daily posture

discord:
  enabled: true
  max_chars: 1900

narrative:
  mode: auto                   # auto | always | never
  timeout_seconds: 180
  claude_bin: claude
