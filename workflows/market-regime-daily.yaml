schema_version: 1
id: market-regime-daily
display_name: Market Regime Daily
display_name_zh: 市场体制每日确认
cadence: daily
estimated_minutes: 15
target_users:
  - part-time-swing-trader
  - growth-investor
difficulty: beginner
api_profile: no-api-basic

when_to_run: >-
  Before considering new swing-trade risk for the day. Run before market open
  or in the first 30 minutes after.
when_to_run_zh: >-
  在考虑当日新的波段交易风险之前执行。在开盘前或开盘后30分钟内运行。
when_not_to_run: >-
  Do not use this output as a standalone buy/sell signal. The exposure_decision
  is a posture (allow / restrict / cash-priority), not a directive.
when_not_to_run_zh: >-
  不要将此输出用作独立的买卖信号。exposure_decision 是一种态势
  （allow / restrict / cash-priority），而非买卖指令。

required_skills:
  - market-breadth-analyzer
  - uptrend-analyzer
  - exposure-coach
optional_skills:
  - market-top-detector
  - macro-regime-detector

artifacts:
  - id: market_breadth_report
    produced_by_step: 1
    required: true
    downstream_hints:
      - swing-opportunity-daily
      - monthly-performance-review
  - id: uptrend_report
    produced_by_step: 2
    required: true
  - id: top_risk_report
    produced_by_step: 3
    required: false
  - id: exposure_decision
    produced_by_step: 4
    required: true
    downstream_hints:
      - swing-opportunity-daily

steps:
  - step: 1
    name: Analyze market breadth
    name_zh: 分析市场涨跌状况
    skill: market-breadth-analyzer
    produces:
      - market_breadth_report
    decision_gate: false

  - step: 2
    name: Analyze uptrend participation
    name_zh: 分析上升趋势参与状况
    skill: uptrend-analyzer
    produces:
      - uptrend_report
    decision_gate: false

  - step: 3
    name: Check market top risk
    name_zh: 检查市场见顶风险
    skill: market-top-detector
    optional: true
    produces:
      - top_risk_report
    decision_gate: false

  - step: 4
    name: Decide exposure posture
    name_zh: 决定敞口策略
    skill: exposure-coach
    consumes:
      - market_breadth_report
      - uptrend_report
      - top_risk_report
    produces:
      - exposure_decision
    decision_gate: true
    decision_question: >-
      Given today's breadth, uptrend participation, and top risk, is new swing
      trade risk allowed, restricted, or cash-priority?
    decision_question_zh: >-
      根据今日的涨跌状况、上升趋势参与度和市场见顶风险，新的波段交易
      风险应设为 allow、restrict 还是 cash-priority？

manual_review:
  - Confirm output is not used as a buy/sell signal.
  - Confirm whether exposure should be reduced, unchanged, or increased.
  - If exposure_decision is restrictive, defer running swing-opportunity-daily.
manual_review_zh:
  - 确认输出未被用作买卖信号。
  - 确认敞口应减少、维持还是增加。
  - 若 exposure_decision 为 restrictive，则推迟执行 swing-opportunity-daily。

journal_destination: trader-memory-core
